<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Hub · 技术技能知识库</title>
  <meta name="description" content="面向机器人与 AI 工程实践的技术技能知识库：C++、ROS2、自动驾驶与具身智能。">
  <link rel="icon" href="_media/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.css">
</head>
<body>
  <div id="app">加载中，请稍候…</div>

  <!-- docsify -->
  <script>
    window.$docsify = {
      name: 'Awesome Hub',
      nameLink: '/awesome_hub/#/',
      repo: 'https://github.com/frankwang98/awesome_hub',
      loadSidebar: true,
      // 让 docs/ros2/README.md 中的 workspace.md 等链接按当前目录解析。
      relativePath: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索知识',
        noData: '没有找到结果',
        depth: 3,
        maxAge: 86400000
      },
      maxLevel: 4,
      auto2top: true,
      coverpage: false,
      notFoundPage: '_404.md',
      themeColor: '#4c9aff',
      // GitHub Pages 部署在自定义域名的 /awesome_hub/ 子路径。
      basePath: '/awesome_hub/',
      formatUpdated: '{YYYY}/{MM}/{DD} {HH}:{mm}'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
